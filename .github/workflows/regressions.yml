name: Learning regressions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 -m unittest discover -s tests -v
      - run: node tests/test_frontend_regressions.js
      - run: node --check learning-path/path_app.js && node --check learning-path/quiz_dialog.js
      - run: python3 learning-path/gen_path_page.py
